name: Build debug APK
on:
  push:
    branches: [Switch-contacts-and-apps, student-fixes-launcher, adding-contact-search, New-search-bar-for-the-home-page, fix-search-results, choppy-scrolling, new-Bolt-Launcher-search, fixes-for-Bolt-Launcher]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Bolt-Bottom-Search-Bar-Debug
          path: app/build/outputs/apk/debug/*.apk
